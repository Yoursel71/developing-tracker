name: test-ve-derle

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Testleri çalıştır
        run: python -m pytest testler/ -v

  derle:
    name: Windows .exe
    needs: test          # testler geçmeden derleme yapılmaz
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: .exe derle
        # plyer için PyInstaller hook'u yok; platform modülü dinamik import
        # edildiği için elle bildirilmezse bildirimler .exe'de hiç çalışmaz.
        #
        # --onedir kullanılıyor (--onefile değil): tek dosyalık derleme kendi
        # kendini geçici bir klasöre açan bir "bootloader" kullanır ve bu
        # örüntü, gerçek trojan'ların davranışına çok benzediği için
        # antivirüslerde (özellikle Windows Defender'ın Wacatac.C!ml gibi
        # ML tabanlı sezgisel kurallarında) sık sık yanlış pozitif üretir.
        # --onedir'de böyle bir açma adımı yok; dosyalar zaten klasörde duruyor.
        run: >-
          pyinstaller --onedir --windowed --name GelisimTakip
          --icon varliklar/ikon.ico
          --add-data "templates;templates"
          --add-data "static;static"
          --add-data "varliklar;varliklar"
          --hidden-import plyer.platforms.win.notification
          --noconfirm
          masaustu.py

      - name: Zip'le
        run: Compress-Archive -Path dist/GelisimTakip/* -DestinationPath dist/GelisimTakip.zip

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: GelisimTakip-exe
          path: dist/GelisimTakip.zip
          retention-days: 30

      - name: Release'i güncelle
        # Yalnızca varsayılan branch: aksi hâlde her deneme branch'i,
        # kullanıcıların indirdiği "son sürüm"ü anında ezerdi.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masaustu-son-surum
          name: "Gelişim Takip — Masaüstü (son derleme)"
          body: >-
            Bu release her başarılı derlemede otomatik güncellenir ve en son
            koddan üretilen uygulamayı içerir.


            GelisimTakip.zip dosyasını indir, klasöre çıkar (extract) ve
            içindeki GelisimTakip.exe'yi çalıştır.


            Windows imzasız uygulamalar için SmartScreen uyarısı gösterir:
            "Daha fazla bilgi" → "Yine de çalıştır" ile açabilirsin.


            Commit: ${{ github.sha }}
          files: dist/GelisimTakip.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
