name: exe-derle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: .exe derle
        run: >-
          pyinstaller --onefile --windowed --name GelisimTakip
          --add-data "templates;templates"
          --add-data "static;static"
          masaustu.py

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: GelisimTakip-exe
          path: dist/GelisimTakip.exe

      - name: Release'e ekle (her başarılı derlemede günceller)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masaustu-son-surum
          name: "Gelişim Takip - Masaüstü (son derleme)"
          body: >-
            Bu release her başarılı derlemede otomatik güncellenir ve her
            zaman en son commit'ten üretilen .exe'yi içerir.
            Commit: ${{ github.sha }}
          files: dist/GelisimTakip.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
