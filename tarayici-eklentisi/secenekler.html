<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Gelişim Takip — Eklenti Ayarları</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d1117; color: #e6edf3;
      margin: 0; padding: 24px; font-size: 14px; line-height: 1.55;
    }
    .kutu { max-width: 460px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #9aa7b4; margin: 0 0 16px; font-size: 13px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    input {
      width: 100%; padding: 8px 10px; font-size: 13px; font-family: inherit;
      color: #e6edf3; background: #151b23;
      border: 1px solid #3d4a5c; border-radius: 6px; box-sizing: border-box;
    }
    input:focus { outline: 2px solid #3fb950; outline-offset: 1px; border-color: #3fb950; }
    button {
      margin-top: 12px; padding: 8px 16px; font-size: 13px; font-weight: 600;
      font-family: inherit; color: #fff; background: #2ea043;
      border: none; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #3fb950; }
    .durum { margin-top: 12px; font-size: 13px; min-height: 20px; }
    .ok { color: #3fb950; }
    .hata { color: #f85149; }
  </style>
</head>
<body>
  <div class="kutu">
    <h1>Gelişim Takip eklentisi</h1>
    <p>
      Masaüstü uygulamasındaki <strong>Ayarlar → Tarayıcı eklentisi</strong>
      bölümünden anahtarı kopyalayıp buraya yapıştır. Bu anahtar olmadan
      eklenti uygulamayla konuşamaz.
    </p>
    <label for="anahtar">API anahtarı</label>
    <input type="text" id="anahtar" placeholder="Ayarlar sayfasından kopyala" autocomplete="off">
    <button id="kaydet">Kaydet</button>
    <div class="durum" id="durum" role="status" aria-live="polite"></div>
  </div>
  <script src="secenekler.js"></script>
</body>
</html>
